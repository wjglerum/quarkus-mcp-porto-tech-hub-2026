quarkus.application.name=conference-api
quarkus.http.port=8080
quarkus.http.access-log.enabled=true
# Skip management endpoints and static assets to keep the access log readable.
quarkus.http.access-log.exclude-pattern=(/q/.*)|(.*\\.(css|js|map|ico|png|svg|jpe?g|gif|woff2?|ttf|eot))

quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USERNAME:conference}
%prod.quarkus.datasource.password=${DB_PASSWORD:conference}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/conference}

quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=none

quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
# Authentication runs on demand, not eagerly.
quarkus.http.auth.proactive=false
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8081/realms/porto}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID:conference-api}
%prod.quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:conference-api-secret}
# Only tokens minted for this API: conference-mcp exchanges the user's token (RFC 8693) for
# one with this audience, so the user's own token (aud=conference-mcp) is rejected here.
quarkus.oidc.token.audience=conference-api
%test.quarkus.oidc.token.audience=https://service.example.com

quarkus.keycloak.devservices.realm-path=../keycloak-realm.json
quarkus.keycloak.devservices.realm-name=porto
quarkus.keycloak.devservices.service-name=porto-keycloak
quarkus.keycloak.devservices.shared=true
# Enable the experimental Keycloak CIMD feature (Client ID Metadata Documents, SEP-991).
# With this on, Keycloak accepts a URL as the client_id and fetches the client metadata
# document at that URL instead of requiring Dynamic Client Registration.
quarkus.keycloak.devservices.features=cimd

%test.quarkus.http.test-port=0
# Tests swap Keycloak for the wiremock OIDC server so real bearer tokens exercise
# token verification, including the acr-based step-up check.
%test.quarkus.oidc.auth-server-url=${keycloak.url}/realms/quarkus
%test.quarkus.keycloak.devservices.enabled=false

quarkus.smallrye-openapi.info-title=Porto Tech Hub 2026 Conference API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true

%dev.demo.now=${DEMO_NOW:2026-11-10T11:40:00+00:00}
demo.now=${DEMO_NOW:}
