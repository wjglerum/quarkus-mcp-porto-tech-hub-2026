quarkus.application.name=conference-chat
quarkus.http.port=8082
quarkus.http.access-log.enabled=true
# Skip management endpoints and static assets to keep the access log readable.
quarkus.http.access-log.exclude-pattern=(/q/.*)|(.*\\.(css|js|map|ico|png|svg|jpe?g|gif|woff2?|ttf|eot))

# Required for @AuthenticationContext (step-up): authentication runs on demand, not eagerly.
quarkus.http.auth.proactive=false
quarkus.oidc.application-type=web-app
quarkus.oidc.client-id=conference-chat
quarkus.oidc.credentials.secret=conference-chat-secret
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET}
quarkus.oidc.authentication.redirect-path=/
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.token.refresh-expired=true
# RP-initiated logout: /logout ends the Keycloak session too, so the next login can be another user.
quarkus.oidc.logout.path=/logout
quarkus.oidc.logout.post-logout-path=/

# Service-account token (client-credentials grant) for MCP calls made outside a user request,
# such as the readiness probe. Reuses the conference-chat client; its service account is
# granted the attendee role in the realm so it satisfies the conference-mcp endpoint gate.
quarkus.oidc-client.auth-server-url=${quarkus.oidc.auth-server-url:}
quarkus.oidc-client.client-id=${quarkus.oidc.client-id}
quarkus.oidc-client.credentials.secret=${quarkus.oidc.credentials.secret}
quarkus.oidc-client.grant.type=client

quarkus.http.auth.permission.assets.paths=/chat.css,/chat.js,/favicon.ico,/q/*
quarkus.http.auth.permission.assets.policy=permit
quarkus.http.auth.permission.chat.paths=/api/*,/,/step-up
quarkus.http.auth.permission.chat.policy=authenticated
# Authenticate inside the JAX-RS chain, not before it. @AuthenticationContext on /step-up
# registers its acr check via a JAX-RS interceptor; if a global HTTP security policy
# authenticates first, that interceptor throws instead of storing the check, so the acr is
# never verified and the step-up popup redirect-loops forever (OidcRecorder step-up guard).
quarkus.http.auth.permission.chat.applies-to=JAXRS
# /logout is not a JAX-RS path: authenticate it at the HTTP layer so the OIDC mechanism sees it.
quarkus.http.auth.permission.logout.paths=/logout
quarkus.http.auth.permission.logout.policy=authenticated

quarkus.keycloak.devservices.realm-path=../keycloak-realm.json
quarkus.keycloak.devservices.realm-name=porto
quarkus.keycloak.devservices.service-name=porto-keycloak
quarkus.keycloak.devservices.shared=true
# Pinned to the version the demo was rehearsed on; a Quarkus bump must not silently change it.
quarkus.keycloak.devservices.image-name=quay.io/keycloak/keycloak:26.7.4
# Enable the experimental Keycloak CIMD feature (Client ID Metadata Documents, SEP-991).
# With this on, Keycloak accepts a URL as the client_id and fetches the client metadata
# document at that URL instead of requiring Dynamic Client Registration.
quarkus.keycloak.devservices.features=cimd

quarkus.langchain4j.mcp.conference.transport-type=streamable-http
quarkus.langchain4j.mcp.conference.url=${CONFERENCE_MCP_URL:http://localhost:8081/mcp}
quarkus.langchain4j.mcp.conference.log-requests=true
quarkus.langchain4j.mcp.conference.log-responses=true

quarkus.langchain4j.anthropic.chat-model.model-name=claude-sonnet-4-6
quarkus.langchain4j.anthropic.api-key=${ANTHROPIC_API_KEY:not-set}
# Fail fast on stage: a slow or unreachable model drops to the scripted planner after 15s, not 30s.
quarkus.langchain4j.anthropic.timeout=15s
# 1 = a single attempt with retrying disabled (0 fails config validation).
quarkus.langchain4j.anthropic.chat-model.max-retries=1
# llm (default): ask the model, fall back to the scripted demo prompts if it fails.
# scripted: never call the model (no wifi). Set with DEMO_PLANNER=scripted.
demo.planner=${DEMO_PLANNER:llm}

%dev.demo.now=${DEMO_NOW:2026-11-10T11:40:00+00:00}
demo.now=${DEMO_NOW:}

%test.quarkus.http.test-port=0
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.langchain4j.mcp.health.enabled=false
%test.quarkus.langchain4j.devservices.enabled=false
%test.quarkus.langchain4j.mcp.conference.transport-type=stdio
%test.quarkus.langchain4j.mcp.conference.command=sh,-c,sleep 600
%test.quarkus.langchain4j.anthropic.api-key=test-key
