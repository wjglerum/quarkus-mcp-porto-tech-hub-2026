# === Application & HTTP ===
quarkus.application.name=conference-mcp
quarkus.http.port=8081
quarkus.http.access-log.enabled=true
quarkus.http.access-log.exclude-pattern=(/q/.*)|(.*\\.(css|js|map|ico|png|svg|jpe?g|gif|woff2?|ttf|eot))
%test.quarkus.http.test-port=0

# CORS for browser-based MCP clients (Inspector's direct mode, web agents); server-to-server
# clients such as conference-chat do not need it. Loopback-only via regex because client and
# dev-services ports vary per run; a real deployment swaps this for its fixed https origins.
# Stateless clients on the 2026-07-28 spec also send Mcp-Method and Mcp-Name on every request.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/http://localhost(:[0-9]+)?/
quarkus.http.cors.headers=accept,authorization,content-type,mcp-session-id,mcp-protocol-version,mcp-method,mcp-name,last-event-id
quarkus.http.cors.exposed-headers=mcp-session-id,www-authenticate

# === MCP server ===
quarkus.mcp.server.server-info.name=Porto Tech Hub 2026 Conference Companion
quarkus.mcp.server.server-info.version=1.0.0

# === Security ===
quarkus.http.auth.permission.mcp.paths=/mcp,/mcp/*
quarkus.http.auth.permission.mcp.policy=mcp-scope
quarkus.http.auth.policy.mcp-scope.roles-allowed=attendee

quarkus.oidc.resource-metadata.enabled=true
# delegation:client:conference-mcp asks the user to let this server act for them (Keycloak 26.8
# token exchange delegation, preview). MCP clients request what is listed here.
quarkus.oidc.resource-metadata.scopes=attendee,delegation:client:conference-mcp
quarkus.oidc.resource-metadata.force-https-scheme=false

# Only accept tokens minted for this server (MCP authorization spec MUST). Keycloak has no
# RFC 8707 resource-indicator support yet, so the aud claim comes from the audience mappers
# on the realm's attendee client scope. Wiremock test tokens carry their own fixed audience.
quarkus.oidc.token.audience=conference-mcp
%test.quarkus.oidc.token.audience=https://server.example.com

# Dev and test wire the authorization server automatically (Keycloak Dev Services / wiremock);
# prod must point at a real Keycloak. Service mode validates JWTs against the JWKS, so no
# client id or secret is needed.
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}

# === Keycloak Dev Services (dev) ===
quarkus.keycloak.devservices.realm-path=../keycloak-realm.json
quarkus.keycloak.devservices.realm-name=porto
quarkus.keycloak.devservices.service-name=porto-keycloak
quarkus.keycloak.devservices.shared=true
# Pinned to the version the demo was rehearsed on; a Quarkus bump must not silently change it.
quarkus.keycloak.devservices.image-name=quay.io/keycloak/keycloak:26.8.2
# Token exchange delegation (preview, needs parameterized scopes): the user consents to
# delegation:client:conference-mcp and conference-mcp's exchanged token carries an act claim.
quarkus.keycloak.devservices.features=cimd,token-exchange-delegation,parameterized-scopes
# Dev UI > OpenID Connect > Keycloak provider logs in with quarkus.oidc.client-id, which a
# service app does not need and which defaults to 'quarkus-app'. That client only exists in the
# realm Dev Services generates, not in our imported porto realm, so point it at a public
# dev-only client whose tokens carry aud=conference-mcp and the attendee role.
%dev.quarkus.oidc.client-id=conference-mcp-devui

# Tests swap Keycloak for an in-memory provider
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.auth-server-url=${keycloak.url}/realms/quarkus

# === Token exchange (RFC 8693) towards conference-api ===
# The user's token (aud=conference-mcp) is never forwarded. Before each conference-api call
# TokenExchangeFilter exchanges it at Keycloak for one with aud=conference-api and
# azp=conference-mcp. If the user consented to delegation:client:conference-mcp, the exchange is
# delegated: this server also sends its own service-account token (the "actor" client below) and
# the result carries an act claim naming conference-mcp. Keycloak only allows either for this
# confidential client, with standard token exchange enabled and the conference-api audience in
# its default client scopes; delegation also needs the FGAP delegate permission in the realm.
quarkus.oidc-client.auth-server-url=${quarkus.oidc.auth-server-url}
quarkus.oidc-client.client-id=conference-mcp
quarkus.oidc-client.credentials.secret=conference-mcp-secret
%prod.quarkus.oidc-client.credentials.secret=${OIDC_CLIENT_SECRET}
quarkus.oidc-client.grant.type=exchange
quarkus.oidc-client.grant-options.exchange.audience=conference-api
# The actor token for a delegated exchange: conference-mcp's own service account.
quarkus.oidc-client.actor.auth-server-url=${quarkus.oidc.auth-server-url}
quarkus.oidc-client.actor.client-id=conference-mcp
quarkus.oidc-client.actor.credentials.secret=conference-mcp-secret
%prod.quarkus.oidc-client.actor.credentials.secret=${OIDC_CLIENT_SECRET}
quarkus.oidc-client.actor.grant.type=client

# === Downstream conference API ===
quarkus.rest-client.conference-api-public.url=${CONFERENCE_API_URL:http://localhost:8080}
quarkus.rest-client.conference-api-me.url=${CONFERENCE_API_URL:http://localhost:8080}

# === Demo clock ===
%dev.demo.now=${DEMO_NOW:2026-11-10T11:40:00+00:00}
demo.now=${DEMO_NOW:}


# CIMD: Keycloak (in a container) fetches the client metadata document from
# http://host.docker.internal:8081/cimd/... Quarkus rejects any Host header other than
# localhost with 400 when bound to localhost, so allow that one name in dev.
%dev.quarkus.http.host-validation.allowed-hosts=localhost,127.0.0.1,host.docker.internal
